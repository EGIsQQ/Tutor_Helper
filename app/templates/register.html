<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация — Tutor Helper</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >
</head>

<body>

<main class="container form-page">

    <div class="form-card">

        <p class="eyebrow">Tutor Helper</p>

        <h1>Регистрация</h1>

        <p class="subtitle">
            Создайте аккаунт для работы с дневником репетитора.
        </p>

        <form
            method="post"
            action="/auth"
            class="report-form"
        >

            <label>
                Имя
                <input
                    type="text"
                    name="full_name"
                    placeholder="Введите имя"
                    required
                >
            </label>

            <label>
                Email
                <input
                    type="email"
                    name="email"
                    placeholder="Введите email"
                    required
                >
            </label>

            <label>
                Пароль
                <input
                    type="password"
                    name="password"
                    placeholder="Введите пароль"
                    required
                >
            </label>

            <label>
                Роль
                <select name="role" required>
                    <option value="">Выберите роль</option>
                    <option value="teacher">Учитель</option>
                    <option value="parent">Родитель</option>
                </select>
            </label>

            <button
                type="submit"
                class="button"
            >
                Зарегистрироваться
            </button>

        </form>

        <p class="subtitle">
            Уже есть аккаунт?
            <a href="/auth/login">Войти</a>
        </p>

    </div>

</main>

</body>
</html>
