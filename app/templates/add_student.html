<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый ученик — Tutor Helper</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <main class="container form-page">
        <a class="back-link" href="/auth/user">← На главную</a>

        <section class="form-card">
            <p class="eyebrow">Новый ученик</p>
            <h1>Добавить ученика</h1>
            <p class="subtitle">Заполни известные данные. Позже их можно будет дополнить.</p>

            <form action="/students/add" method="post" class="student-form">
                <label>
                    ФИО ученика <span class="required">*</span>
                    <input
                        type="text"
                        name="full_name"
                        minlength="2"
                        required
                        autofocus
                        placeholder="Например, Анна Иванова"
                    >
                </label>

                <div class="form-grid">
                    <label>
                        Предмет
                        <input type="text" name="subject" placeholder="Например, математика">
                    </label>

                    <label>
                        Уровень или класс
                        <input type="text" name="level" placeholder="Например, 8 класс">
                    </label>
                </div>

                <div class="form-grid">
                    <label>
                        Контакт родителя
                        <input type="text" name="parent_contact" placeholder="Телефон или Telegram">
                    </label>

                    <label>
                        Контакт ученика
                        <input type="text" name="student_contact" placeholder="Телефон или Telegram">
                    </label>
                </div>

                <div class="form-actions">
                    <a class="button button-secondary" href="/auth/user">Отмена</a>
                    <button class="button" type="submit">Сохранить ученика</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
