<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход — Tutor Helper</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >
</head>

<body>

<main class="container form-page">

    <div class="form-card">

        <p class="eyebrow">Tutor Helper</p>

        <h1>Вход</h1>

        <p class="subtitle">
            Войдите в свой аккаунт для продолжения работы.
        </p>

        <form
            method="post"
            action="/auth/login/"
            class="report-form"
        >

            <label>
                Email
                <input
                    type="email"
                    name="username"
                    placeholder="Введите email"
                    required
                >
            </label>

            <label>
                Пароль
                <input
                    type="password"
                    name="password"
                    placeholder="Введите пароль"
                    required
                >
            </label>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}
            
            <button
                type="submit"
                class="button"
            >
                Войти
            </button>

        </form>

        <p class="subtitle">
            Нет аккаунта?
            <a href="/auth/">Зарегистрироваться</a>
        </p>

    </div>

</main>

</body>
</html>
